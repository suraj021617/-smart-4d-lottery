<!DOCTYPE html><html><head><title>LSTM Predictor</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.container{max-width:1200px;margin:0 auto;background:white;padding:20px;border-radius:10px}h1{color:#333}.pred-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:20px 0}.pred-box{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:25px;border-radius:10px;text-align:center}.pred-box h2{margin:0;font-size:32px}.pred-box p{margin:5px 0 0 0;font-size:14px}.back-btn{display:inline-block;padding:10px 20px;background:#2196F3;color:white;text-decoration:none;border-radius:5px;margin-top:20px}</style></head><body><div class="container"><h1>🧠 LSTM Deep Learning Predictor</h1><p>Neural network-style pattern prediction based on digit sequences</p><div class="pred-grid">{% for num, score, reason in predictions[:10] %}<div class="pred-box"><h2>{{ num }}</h2><p>{{ (score * 100)|round(1) }}% confidence</p><p style="font-size:11px">{{ reason }}</p></div>{% endfor %}</div><a href="/" class="back-btn">← Back</a></div></body></html>
