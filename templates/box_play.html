<!DOCTYPE html><html><head><title>Box Play</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.container{max-width:1200px;margin:0 auto;background:white;padding:20px;border-radius:10px}h1{color:#333}.box-section{margin:30px 0;padding:20px;background:#f9f9f9;border-radius:8px}.perm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:10px 0}.perm-box{background:#4CAF50;color:white;padding:10px;border-radius:5px;text-align:center;font-weight:bold}.back-btn{display:inline-block;padding:10px 20px;background:#2196F3;color:white;text-decoration:none;border-radius:5px;margin-top:20px}</style></head><body><div class="container"><h1>📦 Box Play Suggestions</h1>{% for box in suggestions %}<div class="box-section"><h2>Main Number: {{ box.number }}</h2><p><strong>Total Permutations:</strong> {{ box.total_combinations }} | <strong>Cost:</strong> RM{{ box.total_cost }}</p><h3>Permutations:</h3><div class="perm-grid">{% for perm in box.permutations %}<div class="perm-box">{{ perm }}</div>{% endfor %}</div></div>{% endfor %}<a href="/" class="back-btn">← Back</a></div></body></html>
