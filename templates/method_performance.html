<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Method Performance Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        .method-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .method-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .method-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        .accuracy-badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2em;
        }
        .accuracy-high { background: #4CAF50; color: white; }
        .accuracy-medium { background: #FF9800; color: white; }
        .accuracy-low { background: #f44336; color: white; }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .method-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .method-stat {
            text-align: center;
        }
        .method-stat .label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .method-stat .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        .best-method {
            border: 3px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        .crown {
            font-size: 2em;
            margin-left: 10px;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.4);
        }
        .last-update {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 1.1em;
        }
        .recommendation {
            background: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            text-align: center;
            font-size: 1.2em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Prediction Method Performance Dashboard</h1>
            <p style="color: #666; margin-top: 10px;">Track which prediction buttons are actually working!</p>
            <button class="refresh-btn" onclick="location.reload()">🔄 Refresh Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Predictions</h3>
                <div class="value" id="totalPredictions">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Hits</h3>
                <div class="value" id="totalHits">0</div>
            </div>
            <div class="stat-card">
                <h3>Overall Accuracy</h3>
                <div class="value" id="overallAccuracy">0%</div>
            </div>
            <div class="stat-card">
                <h3>Best Method</h3>
                <div class="value" id="bestMethod" style="font-size: 1.5em;">-</div>
            </div>
        </div>

        <div id="methodsContainer"></div>

        <div class="recommendation" id="recommendation"></div>

        <div class="last-update" id="lastUpdate"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/learning-report');
                const data = await response.json();
                
                // Update overall stats
                document.getElementById('totalPredictions').textContent = data.total_predictions || 0;
                document.getElementById('totalHits').textContent = data.total_hits || 0;
                document.getElementById('overallAccuracy').textContent = 
                    (data.overall_accuracy || 0).toFixed(2) + '%';
                
                // Update best method
                if (data.best_method && data.best_method[0]) {
                    document.getElementById('bestMethod').textContent = 
                        data.best_method[0].replace('_', ' ').toUpperCase();
                }
                
                // Display methods
                const container = document.getElementById('methodsContainer');
                container.innerHTML = '';
                
                const methods = data.method_performance || {};
                const bestMethodName = data.best_method ? data.best_method[0] : null;
                
                for (const [methodName, stats] of Object.entries(methods)) {
                    if (stats.predictions > 0) {
                        const isBest = methodName === bestMethodName;
                        const accuracy = stats.accuracy || 0;
                        
                        let accuracyClass = 'accuracy-low';
                        if (accuracy >= 30) accuracyClass = 'accuracy-high';
                        else if (accuracy >= 15) accuracyClass = 'accuracy-medium';
                        
                        const methodCard = `
                            <div class="method-card ${isBest ? 'best-method' : ''}">
                                <div class="method-header">
                                    <div class="method-name">
                                        ${methodName.replace('_', ' ').toUpperCase()}
                                        ${isBest ? '<span class="crown">👑</span>' : ''}
                                    </div>
                                    <div class="accuracy-badge ${accuracyClass}">
                                        ${accuracy.toFixed(2)}%
                                    </div>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${Math.min(accuracy * 3, 100)}%">
                                        ${accuracy.toFixed(1)}%
                                    </div>
                                </div>
                                <div class="method-stats">
                                    <div class="method-stat">
                                        <div class="label">Predictions</div>
                                        <div class="value">${stats.predictions}</div>
                                    </div>
                                    <div class="method-stat">
                                        <div class="label">Hits</div>
                                        <div class="value">${stats.hits}</div>
                                    </div>
                                    <div class="method-stat">
                                        <div class="label">Misses</div>
                                        <div class="value">${stats.predictions - stats.hits}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += methodCard;
                    }
                }
                
                // Recommendation
                const recDiv = document.getElementById('recommendation');
                if (data.best_method && data.best_method[1] >= 20) {
                    recDiv.innerHTML = `
                        <strong>💡 RECOMMENDATION:</strong> Use 
                        <strong>${data.best_method[0].replace('_', ' ').toUpperCase()}</strong> 
                        button for best results! (${data.best_method[1].toFixed(2)}% accuracy)
                    `;
                } else {
                    recDiv.innerHTML = `
                        <strong>⚠️ NOTICE:</strong> Need more data to determine best method. 
                        Keep making predictions and checking results!
                    `;
                }
                
                // Last update
                document.getElementById('lastUpdate').textContent = 
                    'Last Updated: ' + (data.last_update || 'Never');
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
